<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" dir="rtl">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="150" r="180" fill="#2563eb" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#7c3aed" opacity="0.2" filter="url(#glow)" />

  <!-- Outer frame border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.5" />

  <!-- Center Card -->
  <rect x="80" y="80" width="1040" height="470" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Logo Icon Container -->
  <rect x="940" y="140" width="110" height="110" rx="26" fill="url(#primaryGrad)" />
  <!-- Lightning Bolt -->
  <path d="M1000 160 L965 205 L995 205 L990 235 L1025 190 L995 190 Z" fill="#ffffff" />

  <!-- Brand Name -->
  <text x="910" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="end">مقارنات تك</text>
  
  <!-- Tagline / Value Proposition -->
  <text x="1050" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="800" font-size="34" fill="#93c5fd" text-anchor="end">الدليل العربي الأول لمقارنة عتاد الحاسوب بالأرقام الحتمية</text>

  <!-- Description -->
  <text x="1050" y="355" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="500" font-size="22" fill="#94a3b8" text-anchor="end">مقارنات معمارية وتحليلات واقعية لمعدل الإطارات في الألعاب وكفاءة الطاقة</text>

  <!-- Badges Container -->
  <!-- Badge 1: GPUs -->
  <rect x="750" y="420" width="300" height="52" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="900" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" font-size="20" fill="#60a5fa" text-anchor="middle">🎮 كروت الشاشة (GPUs)</text>

  <!-- Badge 2: CPUs -->
  <rect x="420" y="420" width="300" height="52" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
  <text x="570" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" font-size="20" fill="#a78bfa" text-anchor="middle">⚙️ المعالجات (CPUs)</text>

  <!-- Badge 3: Laptops -->
  <rect x="90" y="420" width="300" height="52" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
  <text x="240" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" font-size="20" fill="#f472b6" text-anchor="middle">💻 الحواسيب المحمولة</text>

  <!-- Footer Domain Badge -->
  <text x="1050" y="525" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="600" font-size="18" fill="#64748b" text-anchor="end">mokaranat-tech.pages.dev</text>
  <text x="150" y="525" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="600" font-size="18" fill="#64748b" text-anchor="start">100% حيادية تحريرية | خوارزميات محايدة</text>
</svg>
